<!doctype html>
<meta charset="utf-8">
<title>Mesh gradient + word reveal prototype</title>
<style>
  html,body{margin:0;height:100%;background:#111;font-family:Inter,-apple-system,system-ui,sans-serif}
  #stage{position:relative;width:100vw;aspect-ratio:3022/1708;overflow:hidden;background:#E5E5E5}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  #line{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;white-space:nowrap;
    font-size:2.65vw;font-weight:400;letter-spacing:-.005em;color:#fff;display:flex;gap:.28em}
  #line span{opacity:0;transition:opacity .25s}
  .mk{position:absolute;width:.66vw;height:.66vw;background:#111}
  #hud{position:fixed;left:8px;bottom:8px}
</style>
<div id="stage"><canvas id="c"></canvas><p id="line"></p>
  <i class="mk"></i><i class="mk"></i><i class="mk"></i><i class="mk"></i></div>
<div id="hud"><input id="scrub" type="range" min="0" max="6" step="0.01" value="0" style="width:300px"></div>
<script>
const FRAG=`
precision highp float;
uniform vec2 uRes;uniform float uTime;uniform float uRise; // 0 = gradient below the frame, 1 = in place
vec3 hex(float r,float g,float b){return vec3(r,g,b)/255.;}
void main(){
  vec2 uv=vec2(gl_FragCoord.x/uRes.x,1.-gl_FragCoord.y/uRes.y); // y down
  float t=uTime;
  vec3 gray=hex(229.,229.,229.);
  // Wavy top edge of the red field. Low value = red reaches higher.
  float edge=.455-.075*cos(6.2832*(uv.x-.16)*.95+.25*sin(t*.5))+(1.-uRise)*.95;
  float k=smoothstep(edge-.24,edge+.19,uv.y);       // 0 gray .. 1 red
  // The transition passes through a pale pink/lavender, not a straight gray-red mix.
  vec3 mid=mix(hex(236.,140.,168.),hex(232.,170.,222.),smoothstep(.15,.45,uv.x));
  vec3 red=hex(250.,67.,76.);
  vec3 col=k<.5?mix(gray,mid,smoothstep(0.,.5,k)):mix(mid,red,smoothstep(.5,.92,k));
  // magenta blob, centre right. Drifts slowly.
  vec2 b1=vec2(.62+.03*sin(t*.4),.60+.02*cos(t*.33)+(1.-uRise)*.9);
  float m1=1.-smoothstep(0.,.36,length((uv-b1)*vec2(1.15,1.)));
  col=mix(col,hex(233.,138.,222.),m1*.95*smoothstep(.15,.6,k));
  // pale glow behind the text
  float g0=1.-smoothstep(0.,.2,length((uv-vec2(.47,.49+(1.-uRise)*.9))*vec2(.8,1.)));
  col=mix(col,hex(237.,222.,245.),g0*.85*smoothstep(.05,.4,k));
  // magenta at the right edge
  float m2=1.-smoothstep(0.,.42,length(uv-vec2(1.05,.46+(1.-uRise)*.9)));
  col=mix(col,hex(230.,123.,213.),m2*.9);
  // orange corners (bottom right strong, bottom left weak and fading)
  float o1=1.-smoothstep(0.,.42,length((uv-vec2(1.04,1.04))*vec2(1.,1.15)));
  col=mix(col,hex(252.,150.,38.),o1*uRise);
  float o2=1.-smoothstep(0.,.26,length(uv-vec2(.06,1.08)));
  col=mix(col,hex(246.,140.,50.),o2*uRise*(.5+.5*cos(t*.35)));
  // cool haze, upper left
  float h=1.-smoothstep(0.,.28,length((uv-vec2(.05,edge-.14))*vec2(.8,1.6)));
  col=mix(col,hex(214.,206.,234.),h*.35*(1.-k));
  gl_FragColor=vec4(col,1.);
}`;
const canvas=document.getElementById('c'),gl=canvas.getContext('webgl',{preserveDrawingBuffer:true});
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FRAG));gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={};for(const n of['uRes','uTime','uRise'])U[n]=gl.getUniformLocation(pr,n);
function fit(){const r=canvas.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);canvas.width=r.width*d;canvas.height=r.height*d;}
addEventListener('resize',fit);fit();

const WORDS=['The','AI','powered','platform','for','modern','creatives'];
const line=document.getElementById('line');WORDS.forEach(w=>{const s=document.createElement('span');s.textContent=w;line.appendChild(s);});
const mks=[...document.querySelectorAll('.mk')];
const WORD_START=1.2,WORD_STEP=.42,PAD_X=.6,PAD_Y=.35; // PAD in vw
function render(t){
  gl.viewport(0,0,canvas.width,canvas.height);gl.uniform2f(U.uRes,canvas.width,canvas.height);
  gl.uniform1f(U.uTime,t);const r=Math.min(1,t/1.1);gl.uniform1f(U.uRise,1-Math.pow(1-r,3));gl.drawArrays(gl.TRIANGLES,0,3);
  const shown=Math.max(0,Math.min(WORDS.length,Math.floor((t-WORD_START)/WORD_STEP)+1));
  [...line.children].forEach((s,i)=>{s.style.opacity=i<shown?(i<shown-2?1:.72):0;});
  // markers sit on the corners of the visible words; one random marker blinks off while words are added
  const st=document.getElementById('stage').getBoundingClientRect();
  if(shown===0){mks.forEach(m=>m.style.opacity=0);return;}
  const a=line.children[0].getBoundingClientRect(),b=line.children[shown-1].getBoundingClientRect();
  const vw=st.width/100,x0=a.left-st.left-PAD_X*vw,x1=b.right-st.left+PAD_X*vw,y0=a.top-st.top-PAD_Y*vw,y1=a.bottom-st.top+PAD_Y*vw;
  const pos=[[x0,y0],[x1,y0],[x0,y1],[x1,y1]];
  const settling=shown<WORDS.length||t<WORD_START+WORDS.length*WORD_STEP+.3;
  const off=settling?Math.floor(t*9)%4:-1;
  mks.forEach((m,i)=>{m.style.left=pos[i][0]+'px';m.style.top=pos[i][1]+'px';m.style.opacity=i===off?0:1;});
}
let t0=performance.now(),scrubbing=false;const scrub=document.getElementById('scrub');
function loop(now){if(!scrubbing){const t=((now-t0)/1000)%6;scrub.value=t;render(t);}requestAnimationFrame(loop);}
requestAnimationFrame(loop);scrub.oninput=()=>{scrubbing=true;render(+scrub.value);};
window.renderAt=t=>{scrubbing=true;render(t);};
window.sampleGrid=function(){const w=canvas.width,h=canvas.height,out=[],px=new Uint8Array(4);
  for(let y=0;y<9;y++)for(let x=0;x<9;x++){const fx=Math.min(.99,Math.max(.01,x/8)),fy=Math.min(.97,Math.max(.02,y/8));
    gl.readPixels(Math.floor(fx*w),h-1-Math.floor(fy*h),1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
    out.push([px[0],px[1],px[2]].map(n=>n.toString(16).padStart(2,'0')).join('').toUpperCase());}return out.join(' ');};
</script>
