<!doctype html>
<meta charset="utf-8">
<title>Sun orb prototype</title>
<style>
  html,body{margin:0;height:100%;background:#FDFDFD;font-family:Inter,-apple-system,"SF Pro Text",system-ui,sans-serif}
  #stage{position:relative;width:955px;height:850px;margin:0 auto}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  /* Tab bar: values measured from the reference at 2x, divided by 2. */
  #tabs{position:absolute;left:50%;top:726px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;
    border-radius:999px;background:#FAFAFC;border:1px solid #E7E7EE;box-shadow:0 1px 2px rgba(20,20,40,.04)}
  #tabs button{all:unset;cursor:pointer;height:40px;padding:0 15px;border-radius:999px;font-size:16px;font-weight:500;
    color:#9C9CA8;line-height:40px;transition:color .2s}
  #tabs button[aria-pressed=true]{color:#17171C;background:linear-gradient(#FFFFFF,#F1F1F5);
    box-shadow:0 1px 3px rgba(20,20,40,.14),0 0 0 1px rgba(20,20,40,.05)}
</style>
<div id="stage">
  <canvas id="c" width="1910" height="1700"></canvas>
  <div id="tabs"></div>
</div>
<script>
/*
 * Sun orb. One full-screen fragment shader. No real blur pass: every edge is an
 * analytic soft edge (smoothstep on a signed distance), which is cheaper and
 * resolution independent.
 *
 * All geometry is in "reference pixels": the 1910x1700 crop of the source video.
 * The shader maps the canvas to that space, so numbers here can be checked
 * against the reference frame directly.
 */
const FRAG = `
precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform float uRise;     // 0 = below the horizon and invisible, 1 = fully risen
uniform float uEnergy;   // 0..1 extra saturation used while rising
uniform float uPulse;    // 0..1 white core pulse
uniform float uWarm;     // 0 = default palette, 1 = "Approved" warm palette
uniform float uDusk;     // 0 = default palette, 1 = "Dusk" cool palette
uniform float uSweep;    // 0..1 strength of the rotating highlight on the ring
uniform float uSweepAngle;

const vec3 BG = vec3(253.,253.,253.)/255.;

vec3 hex(float r,float g,float b){return vec3(r,g,b)/255.;}
float sdRoundBox(vec2 p, vec2 b, float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
// Soft coverage of a shape: 1 inside, 0 outside, "soft" px wide transition centred on the edge.
float cover(float d,float soft){return 1.-smoothstep(-soft,soft,d);}

// Vertical colour of the outer glow (the "ring"). y in reference px.
vec3 ringColor(float y){
  vec3 c=hex(253.,214.,160.);                                   // top: light orange
  c=mix(c,hex(255.,150.,120.),smoothstep(330.,860.,y));         // sides: coral
  c=mix(c,hex(212.,138.,178.),smoothstep(900.,1030.,y));        // mauve
  c=mix(c,hex(170.,162.,255.),smoothstep(1040.,1150.,y));       // violet
  c=mix(c,hex(198.,206.,250.),smoothstep(1150.,1215.,y));       // blue
  c=mix(c,hex(222.,232.,255.),smoothstep(1215.,1340.,y));       // pale blue
  return c;
}
vec3 ringWarm(float y){
  vec3 c=hex(253.,214.,160.);
  c=mix(c,hex(255.,156.,124.),smoothstep(330.,900.,y));
  c=mix(c,hex(253.,200.,150.),smoothstep(1050.,1300.,y));
  return c;
}
vec3 ringDusk(float y){
  vec3 c=hex(255.,170.,150.);
  c=mix(c,hex(232.,110.,170.),smoothstep(330.,800.,y));
  c=mix(c,hex(130.,110.,235.),smoothstep(860.,1100.,y));
  c=mix(c,hex(120.,150.,245.),smoothstep(1150.,1330.,y));
  return c;
}

void main(){
  vec2 uv=gl_FragCoord.xy/uRes;
  // Reference space, y down. Fit by height, centre by width.
  float s=1700./uRes.y;
  vec2 P=vec2((gl_FragCoord.x-uRes.x*.5)*s+955.,(uRes.y-gl_FragCoord.y)*s);

  // Rise: the orb comes up from below and grows a little.
  float rise=uRise;
  float scale=mix(.72,1.,rise);
  vec2 C=vec2(955.,930.+ (1.-rise)*520.);          // dome centre
  vec2 q=(P-C)/scale+vec2(955.,930.);               // undo scale around the dome centre

  // 1. Outer glow
  // Egg shape: narrower toward the top, tighter corners at the bottom.
  vec2 qo=q-vec2(955.,800.);
  qo.x*=1.+.11*smoothstep(850.,300.,q.y);
  float dO=sdRoundBox(qo,vec2(835.,540.),qo.y>0.?400.:540.);
  float aO=cover(dO,135.);
  vec3 rc=ringColor(q.y);
  rc=mix(rc,ringWarm(q.y),uWarm);
  rc=mix(rc,ringDusk(q.y),uDusk);
  // pale yellow halo just outside the dome rim (strongest at the top)
  float halo=(1.-smoothstep(0.,150.,length(q-vec2(955.,945.))-645.))*(1.-smoothstep(500.,900.,q.y));
  rc=mix(rc,hex(253.,250.,212.),halo*.8);
  // rotating highlight
  float ang=atan(q.y-930.,q.x-955.);
  float sw=pow(.5+.5*cos(ang-uSweepAngle),3.);
  rc=mix(rc,hex(255.,244.,170.),uSweep*sw*.75);

  // 2. Band (the "water" under the horizon)
  float dB=sdRoundBox(q-vec2(955.,1085.),vec2(700.,150.),140.);
  float aB=cover(dB,85.);
  float ends=smoothstep(570.,720.,abs(q.x-955.));
  vec3 band=mix(hex(253.,224.,252.),hex(244.,170.,255.),ends);
  band=mix(band,hex(232.,220.,253.),smoothstep(1080.,1200.,q.y));
  vec3 bandWarm=mix(hex(253.,227.,170.),hex(253.,214.,165.),smoothstep(1000.,1200.,q.y));
  vec3 bandDusk=mix(hex(214.,150.,240.),hex(150.,140.,245.),smoothstep(1000.,1200.,q.y));
  band=mix(band,bandWarm,uWarm);
  band=mix(band,bandDusk,uDusk);

  // 3. Dome
  float r=length(q-vec2(955.,945.));
  float aD=cover(r-645.,45.)*(1.-smoothstep(915.,975.,q.y));
  float rim=smoothstep(.72,1.,r/645.);
  vec3 dome=mix(hex(253.,253.,243.),hex(253.,252.,214.),smoothstep(540.,700.,q.y));
  dome=mix(dome,hex(252.,246.,188.),smoothstep(700.,900.,q.y));
  dome=mix(dome,hex(253.,244.,168.),rim*.7);
  vec3 domeDusk=mix(hex(255.,236.,200.),hex(255.,176.,150.),smoothstep(420.,900.,q.y));
  dome=mix(dome,domeDusk,uDusk);

  // compose
  vec3 col=BG; float a=aO;
  vec3 orb=rc;
  orb=mix(orb,band,aB);
  orb=mix(orb,dome,aD);

  // energy: push saturation while rising
  float l=dot(orb,vec3(.299,.587,.114));
  orb=mix(vec3(l),orb,1.+uEnergy*.9);
  // early rise is one flat peach tone
  orb=mix(hex(249.,201.,176.),orb,smoothstep(.0,.55,rise));

  // white core pulse: grows from the dome centre, covers dome and band, leaves the ring
  float core=1.-smoothstep(0.,1.,length((q-vec2(955.,900.))/vec2(760.,560.))/(.25+uPulse*1.05));
  orb=mix(orb,vec3(1.),clamp(core*uPulse*1.6,0.,1.)*max(aD,aB));
  orb=mix(orb,vec3(1.),uPulse*.25*aO);

  col=mix(col,orb,a*smoothstep(0.,.25,rise));

  // 4. Notch: white bite at the bottom centre
  float n=length((q-vec2(955.,1350.))/vec2(470.,300.));
  col=mix(col,BG,(1.-smoothstep(.35,1.05,n))*mix(1.,.8,uDusk));

  gl_FragColor=vec4(col,1.);
}`;

const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl',{preserveDrawingBuffer:true,antialias:false});
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FRAG));gl.linkProgram(prog);gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={};for(const n of['uRes','uTime','uRise','uEnergy','uPulse','uWarm','uDusk','uSweep','uSweepAngle'])U[n]=gl.getUniformLocation(prog,n);

/* ---- state machine: every value is a critically damped spring toward a target ---- */
const v={rise:0,energy:0,pulse:0,warm:0,dusk:0,sweep:0};
const target={rise:0,energy:0,warm:0,dusk:0,sweep:0};
const vel={rise:0,energy:0,warm:0,dusk:0,sweep:0};
const STIFF={rise:14,energy:10,warm:9,dusk:9,sweep:12};   // 1/s^2 scale, critically damped
let state='idle',stateT=0,pulses=[];                      // pulses: [{t0,dur,amp}]
const STATES=['Rise','Response','Loading','Approved','Dusk','Set'];
function setState(s){
  state=s;stateT=0;
  if(s==='Rise'){target.rise=1;target.warm=0;target.dusk=0;target.sweep=0;v.energy=1;target.energy=0;}
  if(s==='Response'){target.rise=1;target.sweep=0;pulses.push({t0:now,dur:1.5,amp:1});}
  if(s==='Loading'){target.rise=1;target.sweep=1;}
  if(s==='Approved'){target.rise=1;target.sweep=0;target.warm=1;target.dusk=0;pulses.push({t0:now,dur:1.3,amp:1.25});}
  if(s==='Dusk'){target.rise=.93;target.sweep=0;target.warm=0;target.dusk=1;}
  if(s==='Set'){target.rise=0;target.sweep=0;}
  for(const b of document.querySelectorAll('#tabs button'))b.setAttribute('aria-pressed',b.textContent===s);
}
const tabs=document.getElementById('tabs');
for(const s of STATES){const b=document.createElement('button');b.textContent=s;b.onclick=()=>setState(s);tabs.appendChild(b);}

// Pulse envelope: fast attack (30% of the time), slow release. Peak 1.
function env(x){return x<=0||x>=1?0:x<.3?Math.sin(x/.3*Math.PI/2)**2:Math.cos((x-.3)/.7*Math.PI/2)**2;}
let now=0,last=performance.now();
const LOADING_PERIOD=1.45,LOADING_AMP=.72;
function frame(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;now+=dt;stateT+=dt;
  for(const k in target){const w=STIFF[k];const a=w*w*(target[k]-v[k])-2*w*vel[k];vel[k]+=a*dt;v[k]+=vel[k]*dt;}
  let p=0;pulses=pulses.filter(q=>now-q.t0<q.dur);
  for(const q of pulses)p=Math.max(p,q.amp*env((now-q.t0)/q.dur));
  if(state==='Loading')p=Math.max(p,LOADING_AMP*env((stateT%LOADING_PERIOD)/LOADING_PERIOD));
  v.pulse=p;
  draw();requestAnimationFrame(frame);
}
function draw(){
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.uniform2f(U.uRes,canvas.width,canvas.height);gl.uniform1f(U.uTime,now);
  gl.uniform1f(U.uRise,Math.max(0,Math.min(1.05,v.rise)));gl.uniform1f(U.uEnergy,v.energy);gl.uniform1f(U.uPulse,v.pulse);
  gl.uniform1f(U.uWarm,v.warm);gl.uniform1f(U.uDusk,v.dusk);gl.uniform1f(U.uSweep,v.sweep);
  gl.uniform1f(U.uSweepAngle,-Math.PI/2+now*2.2);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
requestAnimationFrame(frame);

/* ---- test hooks ---- */
window.force=function(o){Object.assign(v,o);Object.assign(target,o);for(const k in vel)vel[k]=0;draw();};
window.sampleGrid=function(){
  draw();const w=canvas.width,h=canvas.height,out=[];const px=new Uint8Array(4);
  for(let y=1;y<10;y++)for(let x=1;x<10;x++){gl.readPixels(Math.floor(x/10*w),h-1-Math.floor(y/10*h),1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
    out.push('#'+[px[0],px[1],px[2]].map(n=>n.toString(16).padStart(2,'0')).join('').toUpperCase());}
  return out.join(' ');
};
</script>
